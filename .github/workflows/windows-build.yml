name: Windows build
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - README.md
      - docs/README.en.md
      - docs/images/**
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
jobs:
  tests:
    name: Unit tests (${{ matrix.shard }}/4)
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            packet_inspector/requirements.txt
      - run: python -m pip install -r requirements-dev.txt
      - name: Run complete test shard
        run: python -m scripts.ci_tests --shard ${{ matrix.shard }} --shards 4 --report .local/ci-tests.json
      - name: Save test timings
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test-timings-${{ matrix.shard }}
          path: .local/ci-tests.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore
  package:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            packet_inspector/requirements.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m scripts.build_inspector --output-dir release/ci
        if: github.event_name != 'pull_request'
      - run: python -m scripts.verify.verify_desktop_exe --release-dir release/ci
        if: github.event_name != 'pull_request'
      - run: python -m scripts.verify.verify_inspector_exe --release-dir release/ci
        if: github.event_name != 'pull_request'
      - run: python -m scripts.verify.verify_overflow_exe --release-dir release/ci
        if: github.event_name != 'pull_request'
      - run: python -m scripts.verify.verify_usage_exe --release-dir release/ci
        if: github.event_name != 'pull_request'
      - run: python -m scripts.verify.verify_upgrade_exe --release-dir release/ci --desktop
        if: github.event_name != 'pull_request'
      - run: python -m scripts.verify.verify_self_upgrade_exe --release-dir release/ci
        if: github.event_name != 'pull_request'
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: CodexRequestOptimizer-Windows-x64
          path: |
            release/ci/CodexPacketInspector.exe
            release/ci/BUILD-SOURCE.json
            release/ci/SHA256SUMS.txt
            release/ci/publish/*
  build:
    if: always() && !cancelled()
    needs: [tests, package]
    runs-on: ubuntu-latest
    steps:
      - name: Require all tests and package checks
        env:
          TESTS_RESULT: ${{ needs.tests.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          test "$TESTS_RESULT" = success
          if [ "$EVENT_NAME" != pull_request ]; then
            test "$PACKAGE_RESULT" = success
          fi
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: CodexRequestOptimizer-Windows-x64
          path: release
      - name: Verify release source and executable
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -m scripts.build_inspector --check-source
          python -m scripts.verify.verify_build_artifact --release-dir release --tag "$RELEASE_TAG"
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release/publish/CodexPacketInspector.exe release/publish/README.md release/publish/LICENSE release/publish/THIRD_PARTY_NOTICES.txt --verify-tag --title "Codex Request Optimizer $RELEASE_TAG" --notes-file .github/RELEASE_NOTES.md
